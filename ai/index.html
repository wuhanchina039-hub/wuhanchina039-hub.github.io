<script>
  /* 读过这本书的读者：主按钮改成“继续读”，目录里标出上次读到的那一章 */
  (function () {
    var btn = document.querySelector('[data-book-read]');
    if (!btn) return;
    try {
      var last = JSON.parse(localStorage.getItem('last-read-' + btn.getAttribute('data-book-read')));
      if (!last || !last.url) return;
      btn.href = last.url;
      btn.textContent = '继续阅读 →';
      var restart = document.querySelector('[data-book-restart]');
      if (restart) {
        restart.querySelector('[data-book-last]').textContent = last.name;
        restart.hidden = false;
      }
      document.querySelectorAll('.toc a').forEach(function (a) {
        if (a.getAttribute('href') !== last.url) return;
        var tag = document.createElement('span');
        tag.className = 'here';
        tag.textContent = '上次读到';
        a.querySelector('.toc-title').insertAdjacentElement('afterend', tag);
      });
    } catch (e) {}
  })();
</script>
